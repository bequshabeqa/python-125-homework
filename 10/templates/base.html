 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            background: #111827;
            color: white;
            margin: 0;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: 0.3s;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .card a {
            text-decoration: none;
            color: #111827;
            font-size: 18px;
            font-weight: bold;
        }

        .badge {
            margin-top: 10px;
            display: inline-block;
            padding: 4px 10px;
            background: #22c55e;
            color: white;
            border-radius: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<h1>🎬 Actors</h1>

<div class="container">

    {% for actor in actors %}
        <div class="card">
            <a href="{% url 'actor_detail' actor.id %}">
                {{ actor.fullname }}
            </a>
        </div>
    {% endfor %}

</div>

</body>
</html>
